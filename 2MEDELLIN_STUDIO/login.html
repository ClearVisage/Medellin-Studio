
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0d">

  <title>Acceso privado | Medellín Studio</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="login-page">

  <main class="login-wrapper">
    <section class="login-card">

      <a href="index.html" class="login-back">
        ← VOLVER A LA WEB
      </a>

      <div class="login-brand">
        MEDELLÍN<span>STUDIO</span>
      </div>

      <span class="login-subtitle">
        PANEL DE ADMINISTRACIÓN
      </span>

      <div class="login-divider"></div>

      <h1>BIENVENIDO<br><span>DE NUEVO.</span></h1>

      <p class="login-description">
        Accede al espacio privado para gestionar
        los servicios de Medellín Studio.
      </p>

      <form id="login-form">

        <div class="login-field">
          <label for="email">CORREO ELECTRÓNICO</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="username"
            required>
        </div>

        <div class="login-field">
          <label for="password">CONTRASEÑA</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required>
        </div>

        <p id="login-message"
           class="login-message"
           role="status"
           aria-live="polite"></p>

        <button type="submit"
                class="login-submit"
                id="login-submit">
          ACCEDER AL PANEL ↗
        </button>

      </form>

      <p class="login-footer">
        ACCESO EXCLUSIVO PARA PERSONAL AUTORIZADO
      </p>

    </section>

    <aside class="login-side" aria-hidden="true">
      <div class="login-side-content">
        <span>MEDELLÍN STUDIO / MADRID</span>
        <strong>EL CONTROL<br>DE TU ESTUDIO.</strong>
        <p>Gestión sencilla. Todo en un mismo lugar.</p>
      </div>
    </aside>
  </main>

</body>
</html>
